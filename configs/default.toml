# Hydra Torrent Daemon - Configuration

[daemon]
api_host = "0.0.0.0"
api_port = 8199
# auto-generated on first start when empty
api_key = ""
data_dir = "/config"
create_torrent_folder = false

# ─────────────────────────────────────────────
# RACE SESSION - maximum aggressiveness (hot downloads)
# ─────────────────────────────────────────────
[race]
listen_port = 16171
# Pin this engine's peer sockets to one host interface (optional).
#   bind_interface    = "wg0"          # by NAME, resolved to its IP at start (survives VPN IP changes)
#   listen_interfaces = "10.0.0.2:PORT" # by IP (advanced; comma-separated for multi-home)
bind_interface = ""
listen_interfaces = ""
max_connections = 4000
max_uploads_per_torrent = 100
peer_timeout = 30
inactivity_timeout = 20


[race.custom_choking]
enabled = true
tick_interval_seconds = 2
strategy = "rarity_captive"
max_unchoked = 30
rarity_weight = 0.7
speed_weight = 0.3

# ─────────────────────────────────────────────
# HOARD SESSION - upload-optimized (long-term seeding)
# ─────────────────────────────────────────────
[hoard]
listen_port = 16172
# Pin this engine's peer sockets to one host interface (optional).
#   bind_interface    = "wg0"          # by NAME, resolved to its IP at start (survives VPN IP changes)
#   listen_interfaces = "10.0.0.2:PORT" # by IP (advanced; comma-separated for multi-home)
bind_interface = ""
listen_interfaces = ""
max_connections = 12000
max_uploads_per_torrent = -1
peer_timeout = 20
inactivity_timeout = 20

active_seeds = -1
active_limit = -1
active_downloads = 10

# ─────────────────────────────────────────────
# VPN SPEEDTEST
# ─────────────────────────────────────────────
[vpn_speedtest]
enabled = true
# Public target: measures real peer-facing capacity (against a public iperf3
# server) instead of a VPS loopback that over-estimates. The code auto-retries
# on basePort..+8 when the server is busy.
iperf3_server = "ping.online.net"
iperf3_port = 5201
interval_secs = 3600
duration_secs = 10

# ─────────────────────────────────────────────
# RACE DRAIN - automatic NVMe purge (hand back space)
# ─────────────────────────────────────────────
[race_drain]
enabled = true
check_interval_seconds = 60
high_watermark_pct = 95
low_watermark_pct = 85
race_path = "/race"
min_age_minutes = 10

# ─────────────────────────────────────────────
# BENCH - metrics store (bench.db) sampling & retention
# ─────────────────────────────────────────────
# The per-torrent race_snapshots series is the only bench table that grows with
# fleet size (one row per active race torrent per tick). On large fleets it is
# the dominant writer, so it is bounded here. Steady-state on-disk size ≈
#   active_race_torrents / snapshot_interval_secs * 3600 * retention_hours * ~80 bytes
# Lower retention_hours or raise snapshot_interval_secs on very large fleets,
# or set per_torrent_snapshots = false to drop the series entirely (the cheap
# global bench_samples / tracker_samples series are kept either way).
[bench]
enabled = true                 # false = no bench sampling at all
snapshot_interval_secs = 15    # how often the per-torrent snapshots are written
retention_hours = 24           # prune race_snapshots older than this; 0 = keep forever
prune_interval_mins = 30       # how often the prune + space-reclaim task runs
vacuum = true                  # return pruned pages to the filesystem (incremental auto_vacuum)
per_torrent_snapshots = true   # false = skip race_snapshots, keep only global series

# Optional per-tracker announce passkey override (host substring -> passkey).
# Hot-swap via POST /api/announce/passkeys. Ships empty.
# [announce_passkeys]
# "tracker.example.net" = "your-passkey-here"

[auth]
username = "admin"
# bcrypt hash — generate with: hydra hash-password <password>
password_hash = ""

# --- Advanced: per-disk seed-slot regulation (HDD quiet mode) ---------------
# Off by default. Bounds concurrent active uploaders per disk so spinning
# drives stay quiet. Uncomment and list your disks (Windows drive letters).
# type="ssd" = never capped. Only listed disks are regulated.
# [hoard.disk_slots]
# enabled = true
# default_max_active = 10
# [[hoard.disk_slots.disk]]
# key = "D:"
# type = "hdd"
# max_active = 10
# wake_below = 5
# [[hoard.disk_slots.disk]]
# key = "C:"
# type = "ssd"
