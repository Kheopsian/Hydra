# Hydra Torrent Daemon - Configuration

[daemon]
listen_port_start = 6881
listen_port_end = 6891
api_host = "0.0.0.0"
api_port = 8399
api_key = "change-me-in-production"
data_dir = "/configs"
peer_db_path = "/configs/peers.db"
create_torrent_folder = true

# ─────────────────────────────────────────────
# SESSION RACE - Agressivité maximale
# ─────────────────────────────────────────────
[race]
listen_interfaces = ""
bind_interface = ""
engine = "typhon"
listen_port = 16189
# Second TCP listener for PROXY protocol v2 (v6 bypass path via VPS haproxy)
listen_port_proxy_v2 = 16289
listen_addr_proxy_v2 = "0.0.0.0"
proxy_v2_trusted_sources = ["5.83.129.103", "172.17.0.1"]
socks5_outbound_host = ""
socks5_outbound_port = 1080
socks5_outbound_user = "hydra"
socks5_outbound_pass = "styx2026"
max_connections = 4000
max_connections_per_torrent = 1000
max_uploads_per_torrent = 100
choking_algorithm = "rate_based"
seed_choking_algorithm = "anti_leech"
send_buffer_watermark = 33554432
send_buffer_watermark_factor = 150
send_buffer_low_watermark = 1048576
cache_size = 1048576
read_cache_line_size = 128
write_cache_line_size = 256
peer_timeout = 60
request_timeout = 10
inactivity_timeout = 60
allowed_fast_set_size = 10
aio_threads = 16
connection_speed = 500


[race.custom_choking]
enabled = false
tick_interval_seconds = 2
strategy = "rarity_captive"
max_unchoked = 30
rarity_weight = 0.7
speed_weight = 0.3

[race.predictive_cache]
enabled = true
preload_pieces = 50
preload_strategy = "rarest_first_bias"

# ─────────────────────────────────────────────
# SESSION HOARD - OPTIMISE UPLOAD
# ─────────────────────────────────────────────
[hoard]
listen_interfaces = ""
bind_interface = ""
engine = "typhon"
listen_port = 16188
# Second TCP listener for PROXY protocol v2 (v6 bypass path via VPS haproxy)
listen_port_proxy_v2 = 16288
listen_addr_proxy_v2 = "0.0.0.0"
proxy_v2_trusted_sources = ["5.83.129.103", "172.17.0.1"]
socks5_outbound_host = ""
socks5_outbound_port = 1080
socks5_outbound_user = "hydra"
socks5_outbound_pass = "styx2026"
max_connections = 12000
max_connections_per_torrent = 50
max_uploads_per_torrent = -1
choking_algorithm = "fixed_slots"
seed_choking_algorithm = "round_robin"
send_buffer_watermark = 33554432
send_buffer_low_watermark = 8388608
send_buffer_watermark_factor = 200
cache_size = 0
read_cache_line_size = 64
write_cache_line_size = 64
peer_timeout = 300
request_timeout = 30
inactivity_timeout = 300
aio_threads = 32
unchoke_interval = 5
unchoke_slots_limit = -1
allowed_fast_set_size = 10
connection_speed = 500
peer_turnover = 0
peer_turnover_interval = 120
peer_turnover_cutoff = 90

active_seeds = -1
active_limit = -1
active_downloads = 2000


# ─────────────────────────────────────────────
# PEER INTELLIGENCE
# ─────────────────────────────────────────────
[peer_intel]
enabled = true
retention_days = 90
scoring_weights = { speed = 0.5, reliability = 0.3, response_time = 0.2 }
max_entries = 500000

# ─────────────────────────────────────────────
# MÉTRIQUES
# ─────────────────────────────────────────────
[metrics]
enabled = true
prometheus_port = 9100
export_interval_seconds = 10

# ─────────────────────────────────────────────
# VPN SPEEDTEST
# ─────────────────────────────────────────────
[vpn_speedtest]
enabled = true
iperf3_server = "ping.online.net"
iperf3_port = 5201
interval_secs = 3600
duration_secs = 10

# ─────────────────────────────────────────────
# HUNTARR - Recherche active manquants/upgrades
# ─────────────────────────────────────────────
[huntarr]
enabled = true
interval_minutes = 60
batch_size = 20
search_missing = true
search_upgrade = true
radarr_url = "http://radarr:7878"
radarr_api_key = "33f5b62c927042049a5ac5cdc45039de"
sonarr_url = "http://sonarr:8989"
sonarr_api_key = "1fb0b33e8e254b14a9aef17748ebe7f5"

# ─────────────────────────────────────────────
# RACE DRAIN - Purge auto NVMe
# ─────────────────────────────────────────────
[race_drain]
enabled = true
check_interval_seconds = 60
high_watermark_pct = 95
low_watermark_pct = 85
race_path = "/race"
min_age_minutes = 10

# ─────────────────────────────────────────────
# PROXY - SOCKS5 exit partagé (getPublicIP + vpn_speedtest)
# ─────────────────────────────────────────────
[proxy]
socks5_host = ""
socks5_port = 1080
socks5_user = "hydra"
